<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e2340"/>
      <stop offset="60%" stop-color="#051224"/>
      <stop offset="100%" stop-color="#020813"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cc"/>
      <stop offset="35%" stop-color="#f5c767"/>
      <stop offset="70%" stop-color="#d89b2b"/>
      <stop offset="100%" stop-color="#8a5c10"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79dce8"/>
      <stop offset="100%" stop-color="#1d7f99"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="url(#gold)" stroke-width="1.8"/>

  <!-- Celestial Orbit Rings -->
  <ellipse cx="50" cy="50" rx="42" ry="17" fill="none" stroke="url(#cyanGlow)" stroke-width="1" stroke-dasharray="2 3" transform="rotate(-26 50 50)" opacity="0.8"/>
  <ellipse cx="50" cy="50" rx="42" ry="17" fill="none" stroke="url(#gold)" stroke-width="0.8" transform="rotate(38 50 50)" opacity="0.6"/>

  <!-- Subtle Stars -->
  <circle cx="28" cy="24" r="1.2" fill="#79dce8" opacity="0.9"/>
  <circle cx="72" cy="26" r="1" fill="#fff" opacity="0.8"/>
  <circle cx="80" cy="68" r="1.4" fill="#f5c767" opacity="0.8"/>
  <circle cx="22" cy="74" r="1" fill="#79dce8" opacity="0.7"/>

  <!-- Glowing Trishul (Trident) Group -->
  <g filter="url(#glow)">
    <!-- Central Spear / Trishul Center -->
    <path d="M50 16 L54 36 L52 74 L48 74 L46 36 Z" fill="url(#gold)"/>
    <polygon points="50,12 55,26 50,23 45,26" fill="#fff"/>

    <!-- Left Prong Curve -->
    <path d="M48 45 C41 44 32 38 33 25 C35 25 38 29 42 35 C45 39 48 42 49 46 Z" fill="url(#gold)"/>
    <!-- Right Prong Curve -->
    <path d="M52 45 C59 44 68 38 67 25 C65 25 62 29 58 35 C55 39 52 42 51 46 Z" fill="url(#gold)"/>

    <!-- Crescent Moon (Chandra) at center of Trishul -->
    <path d="M38 48 C41 57 59 57 62 48 C57 53 43 53 38 48 Z" fill="#ffffff"/>
    <path d="M39 48 C43 56 57 56 61 48 C56 52 44 52 39 48 Z" fill="url(#gold)"/>

    <!-- Center Radiant 8-point Star -->
    <polygon points="50,34 52,38 56,40 52,42 50,46 48,42 44,40 48,38" fill="#ffffff"/>

    <!-- Trishul Staff Base & Ring -->
    <rect x="48.5" y="72" width="3" height="17" rx="1.5" fill="url(#gold)"/>
    <circle cx="50" cy="73" r="3.5" fill="url(#gold)"/>
    <circle cx="50" cy="89" r="2" fill="url(#gold)"/>
  </g>
</svg>
